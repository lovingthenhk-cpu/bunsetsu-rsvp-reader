<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文節速読リーダー</title>
<style>
  :root{ color-scheme: light; }
  * { box-sizing: border-box; }
  body{
    margin: 0;
    background: #ffffff;
    color: #1a1a1a;
    font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 24px 16px 48px;
  }
  h1{
    font-size: 15px;
    font-weight: 600;
    color: #444;
    margin: 0 0 20px;
  }
  .panel{
    width: 100%;
    max-width: 640px;
  }

  /* ---- 読み込みエリア ---- */
  fieldset{
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 12px 14px 14px;
    margin: 0 0 14px;
  }
  legend{
    font-size: 12px;
    color: #666;
    padding: 0 6px;
  }
  .presets{
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
  }
  button{ font: inherit; cursor: pointer; }
  .presets button{
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 6px 10px;
    font-size: 13px;
    color: #333;
  }
  .presets button:hover{ background: #f4f4f4; }

  textarea{
    width: 100%;
    height: 70px;
    resize: vertical;
    font-size: 13px;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-family: inherit;
  }
  .row{ display: flex; gap: 8px; margin-top: 8px; }
  .row input[type=text]{
    flex: 1;
    font-size: 13px;
    padding: 7px 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  .row button, .load-btn{
    background: #1a1a1a;
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 7px 14px;
    font-size: 13px;
  }
  .row button:hover, .load-btn:hover{ background: #333; }
  .note{ font-size: 11px; color: #999; margin-top: 6px; line-height: 1.5; }
  .status{ font-size: 12px; color: #b00020; margin-top: 6px; min-height: 1em; }

  /* ---- リーダー本体(RSVP表示) ---- */
  .reader{
    border: 1px solid #eee;
    border-radius: 6px;
    padding: 40px 20px;
    text-align: center;
    margin-bottom: 14px;
  }
  .display{
    font-size: 44px;
    line-height: 1.6;
    min-height: 1.6em;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  .display rt{ font-size: 0.38em; }

  .progress-wrap{ width: 100%; margin-bottom: 4px; }
  .progress-bar{ height: 3px; background: #eee; border-radius: 2px; overflow: hidden; }
  .progress-bar > div{ height: 100%; width: 0%; background: #1a1a1a; }
  .progress-num{
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #999;
    margin-top: 4px;
  }

  /* ---- 操作エリア ---- */
  .controls{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 18px;
  }
  .controls button{
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 8px 14px;
    font-size: 13px;
    color: #333;
    min-width: 44px;
  }
  .controls button:hover{ background: #f4f4f4; }
  #playBtn{
    background: #1a1a1a;
    color: #fff;
    border-color: #1a1a1a;
    min-width: 72px;
  }
  #playBtn:hover{ background: #333; }

  .speed-row{
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 16px;
    font-size: 12px;
    color: #666;
  }
  .speed-row input[type=range]{ flex: 1; }
  .speed-row span{ min-width: 78px; text-align: right; }

  /* ---- 全文表示パネル ---- */
  .fulltext-wrap{
    margin-top: 22px;
  }
  .fulltext-wrap summary{
    font-size: 12px;
    color: #666;
    cursor: pointer;
    margin-bottom: 8px;
  }
  .fulltext{
    max-height: 260px;
    overflow-y: auto;
    border: 1px solid #eee;
    border-radius: 6px;
    padding: 16px 18px;
    font-size: 15px;
    line-height: 2.1;
    color: #444;
  }
  .fulltext rt{ font-size: 0.55em; color: #888; }
  .fulltext .chunk{ padding: 1px 0; }
  .fulltext .chunk.current{
    background: #fff1a8;
    border-radius: 2px;
    color: #1a1a1a;
  }
</style>
</head>
<body>

  <h1>文節速読リーダー（BudouXによる文節分割・RSVP方式）</h1>

  <div class="panel">
    <fieldset>
      <legend>テキストを読み込む</legend>
      <div class="presets">
        <button type="button" data-preset="merosu">走れメロス（太宰治）</button>
        <button type="button" data-preset="rashomon">羅生門（芥川龍之介）</button>
        <button type="button" data-preset="yumejuya">夢十夜（夏目漱石）</button>
      </div>
      <textarea id="pasteArea" placeholder="ここにテキストを貼り付けてもOK（青空文庫記法のルビにも対応）"></textarea>
      <div class="row">
        <input type="text" id="urlInput" placeholder="raw.githubusercontent.com の青空文庫テキストURL（任意）">
        <button type="button" id="urlLoadBtn">読み込む</button>
      </div>
      <div class="row">
        <button type="button" id="applyPasteBtn" class="load-btn">貼り付けたテキストを使う</button>
      </div>
      <div class="note">プリセットは <code>levelevel/AozoraTxt</code>（GitHub）から取得し、入力者注記を自動除去、ルビは表示に利用します。URL欄には同リポジトリの raw ファイルURLを貼ってください（CORSの都合上、他ドメインは読み込めない場合があります）。</div>
      <div class="status" id="statusMsg"></div>
    </fieldset>
  </div>

  <div class="panel reader">
    <div class="display" id="display">テキストを読み込んでください</div>
  </div>

  <div class="panel progress-wrap">
    <div class="progress-bar"><div id="progressFill"></div></div>
    <div class="progress-num">
      <span id="progressCount">0 / 0</span>
      <span id="timeInfo">全体 0:00</span>
    </div>
  </div>

  <div class="panel">
    <div class="controls">
      <button type="button" id="prevBtn">◀ 戻る</button>
      <button type="button" id="playBtn">再生</button>
      <button type="button" id="nextBtn">進む ▶</button>
    </div>
    <div class="speed-row">
      <label for="speedRange">速度</label>
      <input type="range" id="speedRange" min="200" max="1400" step="50" value="600">
      <span id="speedLabel">600 文字/分</span>
    </div>
  </div>

  <details class="panel fulltext-wrap" open>
    <summary>全文表示（現在位置をハイライト）</summary>
    <div class="fulltext" id="fullText"></div>
  </details>

<script type="module">
import { Parser } from "https://cdn.jsdelivr.net/npm/budoux@0.9.0/module/parser.js";
import { model } from "https://cdn.jsdelivr.net/npm/budoux@0.9.0/module/data/models/ja.js";

const parser = new Parser(model);

const PRESETS = {
  merosu:   "https://raw.githubusercontent.com/levelevel/AozoraTxt/master/person_utf8/000035/1567_ruby_utf8_hashire_merosu.txt",
  rashomon: "https://raw.githubusercontent.com/levelevel/AozoraTxt/master/person_utf8/000879/127_ruby_utf8_rashomon.txt",
  yumejuya: "https://raw.githubusercontent.com/levelevel/AozoraTxt/master/person_utf8/000148/799_ruby_utf8_yume_juya.txt",
};

const displayEl = document.getElementById("display");
const statusEl = document.getElementById("statusMsg");
const progressFill = document.getElementById("progressFill");
const progressCount = document.getElementById("progressCount");
const timeInfo = document.getElementById("timeInfo");
const playBtn = document.getElementById("playBtn");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const speedRange = document.getElementById("speedRange");
const speedLabel = document.getElementById("speedLabel");
const pasteArea = document.getElementById("pasteArea");
const fullTextEl = document.getElementById("fullText");

// chunks[i] は null（段落区切り）か、トークン配列（{type:'text',text} / {type:'ruby',base,reading}）
let chunks = [];
let index = 0;
let playing = false;
let timerId = null;
let durations = [];   // durations[i] = chunks[i] の表示時間(ms)
let suffixMs = [];     // suffixMs[i] = chunks[i..末尾] の合計時間(ms)
let chunkElByIndex = new Map();

// ---------------------------------------------------------------
// 青空文庫のヘッダー/フッター（凡例・底本情報）を除去
// ---------------------------------------------------------------
function stripAozoraHeaderFooter(raw) {
  const lines = raw.split(/\r\n|\n/);
  const sepIdx = [];
  lines.forEach((l, i) => { if (/^-{20,}$/.test(l.trim())) sepIdx.push(i); });

  let bodyStart = 0;
  if (sepIdx.length >= 2) bodyStart = sepIdx[1] + 1;

  let bodyEnd = lines.length;
  for (let i = bodyStart; i < lines.length; i++) {
    if (/^底本/.test(lines[i].trim())) { bodyEnd = i; break; }
  }

  let body = lines.slice(bodyStart, bodyEnd).join("\n");
  body = body.replace(/［＃[^］]*］/g, "");
  body = body.replace(/\n{3,}/g, "\n\n").trim();
  return body;
}

// ---------------------------------------------------------------
// 1段落分のテキストを「プレーン文字列トークン」と「ルビトークン」に分解
// 例: "邪智暴虐《じゃちぼうぎゃく》" -> {type:'ruby', base:'邪智暴虐', reading:'じゃちぼうぎゃく'}
// "｜"（ルビの開始位置指定）があればそれを優先し、無ければ直前の連続する漢字をベースとみなす
// ---------------------------------------------------------------
const isKanji = ch => /[\u4E00-\u9FFF\u3005\u303B\u3007]/.test(ch);

function tokenizeParagraph(text) {
  const tokens = [];
  let i = 0;
  const n = text.length;
  while (i < n) {
    const rubyStart = text.indexOf("《", i);
    if (rubyStart === -1) {
      const rest = text.slice(i).replace(/｜/g, "");
      if (rest) tokens.push({ type: "text", text: rest });
      break;
    }
    const rubyEnd = text.indexOf("》", rubyStart);
    if (rubyEnd === -1) {
      const rest = text.slice(i).replace(/｜/g, "");
      if (rest) tokens.push({ type: "text", text: rest });
      break;
    }
    const reading = text.slice(rubyStart + 1, rubyEnd);
    const between = text.slice(i, rubyStart);
    const pipeIdx = between.lastIndexOf("｜");
    let plainPart, base;
    if (pipeIdx !== -1) {
      plainPart = between.slice(0, pipeIdx).replace(/｜/g, "");
      base = between.slice(pipeIdx + 1);
    } else {
      let k = between.length;
      while (k > 0 && isKanji(between[k - 1])) k--;
      plainPart = between.slice(0, k);
      base = between.slice(k);
    }
    if (plainPart) tokens.push({ type: "text", text: plainPart });
    if (base) tokens.push({ type: "ruby", base, reading });
    i = rubyEnd + 1;
  }
  return tokens;
}

// トークン列を「ベース文字だけを並べたプレーン文字列」に投影し、
// 各文字がどのトークンの何文字目に対応するかを記録する
function projectPlain(tokens) {
  let s = "";
  const tokIdx = [];
  const localOff = [];
  tokens.forEach((tok, ti) => {
    const piece = tok.type === "ruby" ? tok.base : tok.text;
    for (let c = 0; c < piece.length; c++) { tokIdx.push(ti); localOff.push(c); }
    s += piece;
  });
  return { s, tokIdx, localOff };
}

// BudouXの区切り位置をプレーン文字列上で計算し、ルビ語を分断しないようスナップしてから
// トークン列を実際の文節チャンク（トークン配列の配列）に分割する
function chunkTokens(tokens) {
  const { s, tokIdx, localOff } = projectPlain(tokens);
  if (s.length === 0) return [];

  let boundaries = parser.parseBoundaries(s);
  boundaries = boundaries.map(b => {
    const tiBefore = tokIdx[b - 1];
    if (b < s.length && tokIdx[b] === tiBefore && tokens[tiBefore].type === "ruby") {
      let end = b;
      while (end < s.length && tokIdx[end] === tiBefore) end++;
      return end;
    }
    return b;
  });
  boundaries = [...new Set(boundaries)].sort((a, b) => a - b).filter(b => b > 0 && b < s.length);

  const cuts = [0, ...boundaries, s.length];
  const result = [];
  for (let i = 0; i < cuts.length - 1; i++) {
    const start = cuts[i], end = cuts[i + 1];
    if (start >= end) continue;
    const pieceTokens = [];
    let p = start;
    while (p < end) {
      const ti = tokIdx[p];
      const tok = tokens[ti];
      if (tok.type === "ruby") {
        pieceTokens.push(tok);
        while (p < end && tokIdx[p] === ti) p++;
      } else {
        const lo = localOff[p];
        let q = p;
        while (q < end && tokIdx[q] === ti) q++;
        const hi = localOff[q - 1] + 1;
        pieceTokens.push({ type: "text", text: tok.text.slice(lo, hi) });
        p = q;
      }
    }
    result.push(pieceTokens);
  }
  return result;
}

function buildChunks(text) {
  const paragraphs = text.split(/\n+/).map(p => p.trim()).filter(Boolean);
  const result = [];
  for (const p of paragraphs) {
    const toks = tokenizeParagraph(p);
    for (const c of chunkTokens(toks)) result.push(c);
    result.push(null); // 段落の区切り(表示は空白のポーズ)
  }
  while (result.length && result[result.length - 1] === null) result.pop();
  return result;
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function chunkToHtml(chunk) {
  if (chunk === null) return "";
  return chunk.map(tok => tok.type === "ruby"
    ? `<ruby>${escapeHtml(tok.base)}<rt>${escapeHtml(tok.reading)}</rt></ruby>`
    : escapeHtml(tok.text)
  ).join("");
}

function chunkCharLen(chunk) {
  if (chunk === null) return 3;
  return Math.max(chunk.reduce((a, t) => a + (t.type === "ruby" ? t.base.length : t.text.length), 0), 1);
}

// ---------------------------------------------------------------
// 全文表示パネルの構築（現在位置ハイライト用にチャンクごとにspanで囲む）
// ---------------------------------------------------------------
function renderFullText() {
  let html = "<p>";
  chunks.forEach((c, i) => {
    if (c === null) html += "</p><p>";
    else html += `<span class="chunk" data-idx="${i}">${chunkToHtml(c)}</span>`;
  });
  html += "</p>";
  fullTextEl.innerHTML = html;

  chunkElByIndex = new Map();
  fullTextEl.querySelectorAll(".chunk").forEach(el => {
    chunkElByIndex.set(Number(el.dataset.idx), el);
  });
}

function setText(rawText, { isAozora }) {
  const text = isAozora ? stripAozoraHeaderFooter(rawText) : rawText;
  chunks = buildChunks(text);
  index = 0;
  pause();
  renderFullText();
  computeDurations();
  updateDisplay();
  setStatus("");
}

function setStatus(msg, isError) {
  statusEl.textContent = msg;
  statusEl.style.color = isError ? "#b00020" : "#666";
}

// ---------------------------------------------------------------
// 所要時間の計算
// ---------------------------------------------------------------
function charsPerMinute() { return Number(speedRange.value); }

function durationForChunk(chunk) {
  const charsPerSec = charsPerMinute() / 60;
  const len = chunkCharLen(chunk);
  return Math.max((len / charsPerSec) * 1000, 60); // 短すぎるチラつきを防止
}

function computeDurations() {
  durations = chunks.map(durationForChunk);
  suffixMs = new Array(durations.length + 1).fill(0);
  for (let i = durations.length - 1; i >= 0; i--) suffixMs[i] = suffixMs[i + 1] + durations[i];
}

function formatTime(ms) {
  const totalSec = Math.max(Math.round(ms / 1000), 0);
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return `${m}:${String(s).padStart(2, "0")}`;
}

// ---------------------------------------------------------------
// 表示更新
// ---------------------------------------------------------------
function updateDisplay() {
  const total = chunks.length;

  if (total === 0) {
    displayEl.textContent = "テキストを読み込んでください";
    progressFill.style.width = "0%";
    progressCount.textContent = "0 / 0";
    timeInfo.textContent = "全体 0:00";
    return;
  }

  const cur = chunks[index];
  displayEl.innerHTML = cur === null ? "" : chunkToHtml(cur);

  progressFill.style.width = `${Math.round((index / (total - 1 || 1)) * 100)}%`;
  progressCount.textContent = `${index + 1} / ${total}`;

  const remaining = suffixMs[index] ?? 0;
  const total_ms = suffixMs[0] ?? 0;
  timeInfo.textContent = playing
    ? `残り ${formatTime(remaining)}（全体 ${formatTime(total_ms)}）`
    : `全体 ${formatTime(total_ms)}`;

  const prevEl = fullTextEl.querySelector(".chunk.current");
  if (prevEl) prevEl.classList.remove("current");
  const curEl = chunkElByIndex.get(index);
  if (curEl) {
    curEl.classList.add("current");
    curEl.scrollIntoView({ block: "center", behavior: "smooth" });
  }
}

function step() {
  if (!playing) return;
  if (index >= chunks.length - 1) { pause(); return; }
  index += 1;
  updateDisplay();
  timerId = setTimeout(step, durationForChunk(chunks[index]));
}

function play() {
  if (chunks.length === 0) { setStatus("先にテキストを読み込んでください", true); return; }
  if (index >= chunks.length - 1) index = 0;
  playing = true;
  playBtn.textContent = "一時停止";
  updateDisplay();
  timerId = setTimeout(step, durationForChunk(chunks[index]));
}

function pause() {
  playing = false;
  playBtn.textContent = "再生";
  if (timerId) { clearTimeout(timerId); timerId = null; }
  updateDisplay();
}

playBtn.addEventListener("click", () => playing ? pause() : play());
prevBtn.addEventListener("click", () => { pause(); index = Math.max(0, index - 1); updateDisplay(); });
nextBtn.addEventListener("click", () => { pause(); index = Math.min(chunks.length - 1, index + 1); updateDisplay(); });

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
  if (e.code === "Space") { e.preventDefault(); playing ? pause() : play(); }
  if (e.code === "ArrowRight") { pause(); index = Math.min(chunks.length - 1, index + 1); updateDisplay(); }
  if (e.code === "ArrowLeft") { pause(); index = Math.max(0, index - 1); updateDisplay(); }
});

speedRange.addEventListener("input", () => {
  speedLabel.textContent = `${speedRange.value} 文字/分`;
  computeDurations();
  updateDisplay();
});

document.getElementById("applyPasteBtn").addEventListener("click", () => {
  const t = pasteArea.value.trim();
  if (!t) { setStatus("テキストが空です", true); return; }
  setText(t, { isAozora: false });
});

async function loadFromUrl(url) {
  setStatus("読み込み中…");
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    setText(text, { isAozora: true });
  } catch (err) {
    setStatus(`読み込みに失敗しました（${err.message}）。CORSの制限がかかっているドメインの可能性があります。`, true);
  }
}

document.querySelectorAll(".presets button").forEach(btn => {
  btn.addEventListener("click", () => loadFromUrl(PRESETS[btn.dataset.preset]));
});

document.getElementById("urlLoadBtn").addEventListener("click", () => {
  const url = document.getElementById("urlInput").value.trim();
  if (!url) { setStatus("URLを入力してください", true); return; }
  loadFromUrl(url);
});
</script>
</body>
</html>
